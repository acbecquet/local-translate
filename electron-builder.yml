appId: com.becquet.localtranslate
productName: local_translate
directories:
  output: dist_installer
files:
  - out/**
  - package.json
# Bundled fonts (src/core/fit/fonts.ts's registerBundledFonts): shipped as
# loose extraResources, NOT via `files` (which would bundle them inside
# app.asar) - resolveFontsDir() in fonts.ts checks process.resourcesPath
# first, which is where extraResources land (a sibling of app.asar, not a
# child of it), falling back to the dev/CLI findAppRoot()-based path when
# packaged resources aren't present (see that function's own doc comment).
# config/champion.json (src/core/champion.ts's resolveDefaultModel): shipped
# the same way and for the same reason - the packaged app must be able to
# read the crowned champion model without it being sealed inside app.asar.
# champion.ts's resolveConfigDir() mirrors resolveFontsDir()'s exact
# resourcesPath-first, then findAppRoot()-fallback precedence.
extraResources:
  - from: fonts
    to: fonts
  - from: config
    to: config
win:
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: local_translate-setup-${version}.exe
